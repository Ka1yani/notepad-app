<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notepad</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

<!-- SIDEBAR -->
<aside id="sidebar">
  <div id="sidebar-header">
    <h1>Notepad</h1>
    <button id="btn-new" title="New note">+</button>
  </div>
  <div id="search-wrap">
    <input id="search" type="search" placeholder="Search notes…" autocomplete="off" />
  </div>
  <div id="notes-list">
    <div id="empty-list">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
        <polyline points="14 2 14 8 20 8"/>
      </svg>
      <p>No notes yet.<br/>Click <strong>+</strong> to create one.</p>
    </div>
  </div>
  <div id="sidebar-footer">
    <button class="btn-footer" id="btn-import">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
        <polyline points="7 16 12 21 17 16"/>
        <line x1="12" y1="21" x2="12" y2="9"/>
      </svg>
      Import
    </button>
    <button class="btn-footer" id="btn-export">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
        <polyline points="17 8 12 3 7 8"/>
        <line x1="12" y1="3" x2="12" y2="15"/>
      </svg>
      Export
    </button>
  </div>
</aside>

<!-- EDITOR -->
<main id="editor-pane">
  <div id="editor-toolbar">
    <div id="editor-meta"></div>
    <button id="btn-delete" style="display:none;">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="3 6 5 6 21 6"/>
        <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
        <path d="M10 11v6"/>
        <path d="M14 11v6"/>
        <path d="M9 6V4h6v2"/>
      </svg>
      Delete
    </button>
  </div>

  <div id="empty-editor">
    <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2">
      <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
      <polyline points="14 2 14 8 20 8"/>
      <line x1="16" y1="13" x2="8" y2="13"/>
      <line x1="16" y1="17" x2="8" y2="17"/>
      <polyline points="10 9 9 9 8 9"/>
    </svg>
    <h2>Select a note or create a new one</h2>
    <p>Your personal workspace for thoughts, ideas, and everything in between. All data is saved in your browser.</p>
    <button id="btn-empty-new">Create New Note</button>
  </div>

  <div id="editor-content" style="display:none;">
    <input id="note-title" type="text" placeholder="Note Title" />
    <textarea id="note-body" placeholder="Start typing your note here…"></textarea>
  </div>
</main>

<!-- DELETE MODAL -->
<div id="modal-overlay">
  <div id="modal">
    <h3>Delete note?</h3>
    <p id="modal-msg">This action cannot be undone.</p>
    <div id="modal-actions">
      <button class="btn-cancel" id="modal-cancel">Cancel</button>
      <button class="btn-confirm-delete" id="modal-confirm">Delete</button>
    </div>
  </div>
</div>

<!-- Hidden file input for import -->
<input type="file" id="file-input" accept=".json,application/json" />

<script src="js/app.js"></script>
</body>
</html>
